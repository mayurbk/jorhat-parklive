<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f766e" />
  <title>Jorhat ParkLive — Real-Time Parking Finder</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="top-bar">
      <div class="header-row">
        <div class="brand">
          <div class="brand-badge">P</div>
          <div>
            <div class="brand-title">Jorhat ParkLive</div>
            <button id="dbStatusBtn" type="button" class="status-pill" title="Configure Supabase key">
              <span id="dbDot" class="status-dot"></span>
              <span id="dbStatusText">Local Demo</span>
            </button>
          </div>
        </div>
        <div class="header-actions">
          <button id="openInsertTopBtn" type="button" class="btn btn-primary">+ Insert</button>
        </div>
      </div>

      <input
        id="searchInput"
        class="search-input"
        type="search"
        placeholder="Search Gar-Ali, A.T. Road, K.B. Road, JMCH..."
      />

      <div class="filter-row">
        <button class="chip active" data-filter="all">All</button>
        <button class="chip" data-filter="free">Free Only</button>
        <button class="chip" data-filter="2w">2-Wheeler</button>
        <button class="chip" data-filter="4w">4-Wheeler</button>
        <button class="chip" data-filter="near">Near Me</button>
      </div>
    </header>

    <main class="map-stage">
      <div id="map"></div>

      <div class="legend-card">
        <div class="legend-item"><span class="dot" style="background:#16a34a"></span> Available</div>
        <div class="legend-item"><span class="dot" style="background:#d97706"></span> Limited</div>
        <div class="legend-item"><span class="dot" style="background:#dc2626"></span> Full</div>
      </div>

      <div class="map-fab-col">
        <button id="gpsBtn" type="button" class="fab-icon" title="My Location">GPS</button>
        <button id="recenterBtn" type="button" class="fab-icon" title="Center on Jorhat">JH</button>
      </div>

      <button id="openInsertFabBtn" type="button" class="btn btn-primary floating-cta">
        + Insert Spot
      </button>
    </main>

    <section class="bottom-sheet">
      <div class="sheet-header">
        <span>Jorhat Parking Zones</span>
        <span id="listCount">8 zones</span>
      </div>
      <div id="spotList" class="spot-list"></div>
    </section>
  </div>

  <!-- Insert Spot Modal -->
  <div id="insertModal" class="modal-backdrop" role="dialog" aria-modal="true">
    <div class="modal-card">
      <div class="modal-title">Insert New Parking Spot</div>
      <form id="insertForm">
        <div class="field">
          <label for="spotName">Spot Name</label>
          <input id="spotName" type="text" required placeholder="e.g., Gar-Ali Near Clock Tower" />
        </div>
        <div class="grid-2">
          <div class="field">
            <label for="spotZone">Zone</label>
            <select id="spotZone">
              <option value="Gar-Ali">Gar-Ali</option>
              <option value="A.T. Road">A.T. Road</option>
              <option value="K.B. Road">K.B. Road</option>
              <option value="Chowk Bazar">Chowk Bazar</option>
              <option value="Court Field">Court Field</option>
              <option value="JMCH / Kenduguri">JMCH / Kenduguri</option>
              <option value="Tarajan">Tarajan</option>
              <option value="JEC Road">JEC Road</option>
            </select>
          </div>
          <div class="field">
            <label for="spotPaid">Access Type</label>
            <select id="spotPaid">
              <option value="false">Free</option>
              <option value="true">Paid</option>
            </select>
          </div>
        </div>
        <div class="grid-2">
          <div class="field">
            <label for="spotLat">Latitude</label>
            <input id="spotLat" type="number" step="0.0001" required />
          </div>
          <div class="field">
            <label for="spotLng">Longitude</label>
            <input id="spotLng" type="number" step="0.0001" required />
          </div>
        </div>
        <div class="grid-2">
          <div class="field">
            <label for="spotFree">Free Spots</label>
            <input id="spotFree" type="number" min="0" value="5" required />
          </div>
          <div class="field">
            <label for="spotTotal">Total Capacity</label>
            <input id="spotTotal" type="number" min="1" value="12" required />
          </div>
        </div>
        <div class="check-row">
          <label><input id="veh2w" type="checkbox" checked /> 2-Wheeler</label>
          <label><input id="veh4w" type="checkbox" checked /> 4-Wheeler</label>
        </div>
        <div class="modal-footer">
          <button id="cancelInsertBtn" type="button" class="btn btn-secondary">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Spot</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Supabase Key Modal -->
  <div id="dbModal" class="modal-backdrop" role="dialog" aria-modal="true">
    <div class="modal-card">
      <div class="modal-title">Supabase Realtime Connection</div>
      <div class="field">
        <label for="sbKeyInput">Publishable / Anon Key</label>
        <input id="sbKeyInput" type="password" placeholder="Paste your Supabase client key" />
      </div>
      <div class="spot-meta">Project URL: https://qvnzxljlylccvuslzncj.supabase.co</div>
      <div class="modal-footer">
        <button id="cancelDbBtn" type="button" class="btn btn-secondary">Close</button>
        <button id="saveDbKeyBtn" type="button" class="btn btn-primary">Connect</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./app.js"></script>
</body>
</html>
